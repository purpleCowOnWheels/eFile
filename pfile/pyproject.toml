[tool.poetry]
name = "pfile"
version = "0.1.0"
description = "Automate US federal tax preparation and paper filing"
authors = []
license = "MIT"
readme = "README.md"
packages = [{ include = "pfile", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.0"
typer = "^0.12"
rich = "^13.0"
questionary = "^2.0"
pdfplumber = "^0.11"
pypdf = "^4.0"
pdf2image = "^1.17"
openai = "^1.0"
reportlab = "^4.0"
python-dotenv = "^1.0"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
ruff = "^0.4"

[tool.poetry.scripts]
pfile = "pfile.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

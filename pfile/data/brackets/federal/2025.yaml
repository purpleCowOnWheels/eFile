    - { rate: 0.12,  min: 23850,   base: 2385.00 }
    - { rate: 0.22,  min: 96950,   base: 11157.00 }
    - { rate: 0.24,  min: 206700,  base: 35302.00 }
    - { rate: 0.32,  min: 394600,  base: 80398.00 }
    - { rate: 0.35,  min: 501050,  base: 114462.00 }
    - { rate: 0.37,  min: 751600,  base: 202154.50 }

  mfs:  # same thresholds as single

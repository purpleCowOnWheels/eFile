# ---------------------------------------------------------------------------
# Standard deductions
# ---------------------------------------------------------------------------

standard_deduction:
  single: 15000
  mfj:    30000
  mfs:    15000
  hoh:    22500
  qss:    30000
  # Additional deduction for age 65+ or blind
  additional_single: 1600
  additional_mfj_per_spouse: 1350


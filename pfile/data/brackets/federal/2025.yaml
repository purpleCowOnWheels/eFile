    - { rate: 0.22,  min: 48475,   base: 5578.50 }
    - { rate: 0.24,  min: 103350,  base: 17651.50 }
    - { rate: 0.32,  min: 197300,  base: 40199.50 }
    - { rate: 0.35,  min: 250525,  base: 57231.00 }
    - { rate: 0.37,  min: 626350,  base: 188769.75 }

  mfj:

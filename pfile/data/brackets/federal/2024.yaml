# ---------------------------------------------------------------------------
# Social Security benefit taxability thresholds
# Source: IRC §86; IRS Pub. 915
# ---------------------------------------------------------------------------

social_security:
  single_hoh_mfs:
    tier1_lower: 25000   # below: 0% taxable
    tier1_upper: 34000   # 25k-34k: up to 50% taxable
    tier2_rate: 0.85     # above 34k: up to 85% taxable
  mfj_qss:
    tier1_lower: 32000
    tier1_upper: 44000
    tier2_rate: 0.85

# ---------------------------------------------------------------------------
# Child Tax Credit (CTC)
# Source: IRC §24; Rev. Proc. 2023-34
# ---------------------------------------------------------------------------

child_tax_credit:
  per_child: 2000
  max_refundable: 1600      # Additional CTC (ACTC) per child
  phaseout_single_hoh: 200000
  phaseout_mfj_qss:   400000
  phaseout_mfs:       200000
  phaseout_rate: 50         # $50 reduction per $1,000 over threshold

# ---------------------------------------------------------------------------
# Dependent Care Credit
# Source: IRC §21; IRS Pub. 503
# ---------------------------------------------------------------------------

dependent_care:
  max_expenses_1_child:  3000
  max_expenses_2_plus:   6000
  min_credit_rate: 0.20
  max_credit_rate: 0.35
  phaseout_start_agi: 15000

# ---------------------------------------------------------------------------
# Net Investment Income Tax (NIIT)
# Source: IRC §1411
# ---------------------------------------------------------------------------

niit:
  rate: 0.038
  threshold_single:  200000
  threshold_mfj:     250000
  threshold_mfs:     125000
  threshold_hoh:     200000

# ---------------------------------------------------------------------------
# SE (Self-Employment) Tax
# Source: IRC §1401; IRC §164(f)
# ---------------------------------------------------------------------------

self_employment:
  se_tax_rate: 0.153        # 12.4% SS + 2.9% Medicare
  ss_wage_base: 168600      # 2024 SS wage base
  deductible_fraction: 0.50

# ---------------------------------------------------------------------------
# Additional Medicare Tax
# Source: IRC §3103
# ---------------------------------------------------------------------------

additional_medicare:
  rate: 0.009
  threshold_single:  200000
  threshold_mfj:     250000
  threshold_mfs:     125000

# ---------------------------------------------------------------------------
# Qualified Business Income (QBI) Deduction — §199A
# Source: IRC §199A; Rev. Proc. 2023-34
# ---------------------------------------------------------------------------

qbi:
  rate: 0.20
  threshold_mfj:     383900
  threshold_single:  191950
  threshold_mfs:     191950
  threshold_hoh:     191950
  threshold_qss:     383900
  range_mfj:         100000
  range_others:       50000

# ---------------------------------------------------------------------------
# Empire State Child Credit (NY IT-213) — pre-TCJA federal CTC parameters
# NY uses pre-2017 (pre-TCJA) federal CTC rules to compute the 33% component.
# Source: NY IT-213-I instructions; Tax Law §606(c-1)
# ---------------------------------------------------------------------------

empire_state_child_credit:
  # Pre-TCJA parameters (Public Law 115-97 rolled back for this calculation)
  pre_tcja_per_child: 1000        # $1,000/child before TCJA doubled it
  phaseout_mfj_qss:   110000      # MFJ/QSS threshold (pre-TCJA)
  phaseout_single_hoh: 75000      # Single/HOH threshold
  phaseout_mfs:        55000      # MFS threshold
  # Phase-out: 5% of (excess rounded up to next $1,000)
  phaseout_factor: 0.05
  # NY credit rate
  ny_credit_rate: 0.33            # 33% of pre-TCJA CTC
  # $100/child floor — ONLY available if FAGI ≤ phaseout threshold (line 3 = Yes)
  per_child_floor: 100

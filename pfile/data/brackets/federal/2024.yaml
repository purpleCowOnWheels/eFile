# ---------------------------------------------------------------------------
# Standard deductions
# ---------------------------------------------------------------------------

standard_deduction:
  single: 14600
  mfj:    29200
  mfs:    14600
  hoh:    21900
  qss:    29200
  # Additional deduction for age 65+ or blind (per person)
  additional_single: 1550
  additional_mfj_per_spouse: 1550


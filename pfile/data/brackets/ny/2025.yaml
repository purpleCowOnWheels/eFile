# New York State Income Tax Data — Tax Year 2025
# Source: NY Tax Law §601; NY DTF Publication 88
# URL: https://www.tax.ny.gov/pdf/publications/income/pub88.pdf
# Note: NY does NOT inflation-adjust brackets annually.
# Rates at the top four brackets (9.65% – 10.9%) are in effect 2021–2027
# per the New York State FY 2021-22 Enacted Budget.
# Last verified: 2025-01-01

_meta:
  source: "NY Tax Law §601; NY DTF Publication 88"
  url: "https://www.tax.ny.gov/pdf/publications/income/pub88.pdf"
  tax_year: 2025
  last_verified: "2025-01-01"


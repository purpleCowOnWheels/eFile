# ---------------------------------------------------------------------------
# Yonkers resident surcharge
# Source: Yonkers City Code; NY DTF IT-201 instructions
# ---------------------------------------------------------------------------

yonkers:
  resident_surcharge_rate: 0.16750    # 16.75% of NY state tax liability
  nonresident_surcharge_rate: 0.00500 # 0.5% of NY wages for nonresidents

# ---------------------------------------------------------------------------
# NY standard deduction
# Source: NY Tax Law §614; IT-201 instructions
# Note: These amounts are fixed by statute and do not adjust for inflation.
# ---------------------------------------------------------------------------

standard_deduction:
  single: 8000
  mfj:    16050
  mfs:    8000
  hoh:    11200
  qss:    16050

# ---------------------------------------------------------------------------
# NY pension and retirement income exclusions
# Source: NY Tax Law §612(c)(3); IT-201 instructions
# ---------------------------------------------------------------------------

pension_exclusions:
  government_pension_max: 20000  # Up to $20,000 for gov't pensions (NY, federal, military)
  # Social Security benefits are fully excluded from NY income (Tax Law §612(c)(3-a))
  social_security_excluded: true

# ---------------------------------------------------------------------------
# NY college savings (529) deduction
# Source: NY Tax Law §612(c)(32)
# ---------------------------------------------------------------------------

college_savings_529:
  single_max: 5000
  mfj_max:    10000

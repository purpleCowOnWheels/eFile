# ---------------------------------------------------------------------------
# NY Benefit Recapture Worksheets (IT-201-I Tax Computation section)
# Applies when NY AGI (line 33) is more than $107,650.
# Source: NY IT-201-I 2024, worksheets 1–16.
#
# Structure per filing status:
#   low_agi_threshold: recapture kicks in when NY AGI exceeds this
#   flat_recapture: Worksheet 1/7/12 — flat-rate method for low taxable income
#     taxable_ceiling: upper bound of taxable income for this worksheet
#     flat_rate: rate applied to taxable income (e.g. 0.055 for MFJ)
#     full_phase_agi: if AGI >= this, tax = taxable × flat_rate directly
#   tiers: Worksheets 2–5/8–10/13–15 — standard recapture tiers
#     taxable_min / taxable_max: range of taxable income
#     agi_threshold: the AGI level at which phase-in begins
#     recapture_base: fixed amount always added once in this tier
#     incremental_benefit: additional amount fully phased in over $50,000 of AGI
#   flat_top: final worksheet — flat 10.9% for AGI > $25M
# ---------------------------------------------------------------------------
benefit_recapture:
  mfj:
    low_agi_threshold: 107650
    flat_recapture:
      taxable_ceiling: 161550
      flat_rate: 0.055
      full_phase_agi: 157650
    tiers:
      - { taxable_min: 161550,  taxable_max: 323200,   agi_threshold: 161550,  recapture_base: 333,   incremental_benefit: 807 }
      - { taxable_min: 323200,  taxable_max: 2155350,  agi_threshold: 323200,  recapture_base: 1140,  incremental_benefit: 2747 }
      - { taxable_min: 2155350, taxable_max: 5000000,  agi_threshold: 2155350, recapture_base: 3887,  incremental_benefit: 60350 }
      - { taxable_min: 5000000, taxable_max: 25000000, agi_threshold: 5000000, recapture_base: 64237, incremental_benefit: 32500 }
    flat_top: { agi_threshold: 25000000, flat_rate: 0.109 }

  single:
    low_agi_threshold: 107650
    flat_recapture:
      taxable_ceiling: 215400
      flat_rate: 0.06
      full_phase_agi: 157650
    tiers:
      - { taxable_min: 215400,  taxable_max: 1077550,  agi_threshold: 215400,  recapture_base: 568,   incremental_benefit: 1831 }
      - { taxable_min: 1077550, taxable_max: 5000000,  agi_threshold: 1077550, recapture_base: 2399,  incremental_benefit: 30172 }
      - { taxable_min: 5000000, taxable_max: 25000000, agi_threshold: 5000000, recapture_base: 32571, incremental_benefit: 32500 }
    flat_top: { agi_threshold: 25000000, flat_rate: 0.109 }

  mfs:  # same parameters as single
    low_agi_threshold: 107650
    flat_recapture:
      taxable_ceiling: 215400
      flat_rate: 0.06
      full_phase_agi: 157650
    tiers:
      - { taxable_min: 215400,  taxable_max: 1077550,  agi_threshold: 215400,  recapture_base: 568,   incremental_benefit: 1831 }
      - { taxable_min: 1077550, taxable_max: 5000000,  agi_threshold: 1077550, recapture_base: 2399,  incremental_benefit: 30172 }
      - { taxable_min: 5000000, taxable_max: 25000000, agi_threshold: 5000000, recapture_base: 32571, incremental_benefit: 32500 }
    flat_top: { agi_threshold: 25000000, flat_rate: 0.109 }

  hoh:
    low_agi_threshold: 107650
    flat_recapture:
      taxable_ceiling: 269300
      flat_rate: 0.06
      full_phase_agi: 157650
    tiers:
      - { taxable_min: 269300,  taxable_max: 1616450,  agi_threshold: 269300,  recapture_base: 787,   incremental_benefit: 2289 }
      - { taxable_min: 1616450, taxable_max: 5000000,  agi_threshold: 1616450, recapture_base: 3076,  incremental_benefit: 45261 }
      - { taxable_min: 5000000, taxable_max: 25000000, agi_threshold: 5000000, recapture_base: 48337, incremental_benefit: 32500 }
    flat_top: { agi_threshold: 25000000, flat_rate: 0.109 }

  qss:  # same parameters as MFJ
    low_agi_threshold: 107650
    flat_recapture:
      taxable_ceiling: 161550
      flat_rate: 0.055
      full_phase_agi: 157650
    tiers:
      - { taxable_min: 161550,  taxable_max: 323200,   agi_threshold: 161550,  recapture_base: 333,   incremental_benefit: 807 }
      - { taxable_min: 323200,  taxable_max: 2155350,  agi_threshold: 323200,  recapture_base: 1140,  incremental_benefit: 2747 }
      - { taxable_min: 2155350, taxable_max: 5000000,  agi_threshold: 2155350, recapture_base: 3887,  incremental_benefit: 60350 }
      - { taxable_min: 5000000, taxable_max: 25000000, agi_threshold: 5000000, recapture_base: 64237, incremental_benefit: 32500 }
    flat_top: { agi_threshold: 25000000, flat_rate: 0.109 }


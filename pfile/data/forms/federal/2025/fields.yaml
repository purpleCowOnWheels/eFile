# Form 1040 (2025) AcroForm field mapping
# Source: IRS f1040.pdf introspected with PyMuPDF
# Field names follow the pattern: topmostSubform[0].Page{P}[0].<short_name>

# ── Header / Filer Identity ──────────────────────────────────────────────────
filing_status:
  single:         "topmostSubform[0].Page1[0].c1_1[0]"
  mfj:            "topmostSubform[0].Page1[0].c1_2[0]"
  mfs_qss_hoh:    "topmostSubform[0].Page1[0].c1_3[0]"

taxpayer:
  first_name_mi:  "topmostSubform[0].Page1[0].f1_01[0]"
  last_name:      "topmostSubform[0].Page1[0].f1_02[0]"
  ssn:            "topmostSubform[0].Page1[0].f1_03[0]"

spouse:
  first_name_mi:  "topmostSubform[0].Page1[0].f1_05[0]"
  last_name:      "topmostSubform[0].Page1[0].f1_06[0]"
  ssn:            "topmostSubform[0].Page1[0].f1_04[0]"

address:
  street:         "topmostSubform[0].Page1[0].Address_ReadOrder[0].f1_20[0]"
  apt:            "topmostSubform[0].Page1[0].Address_ReadOrder[0].f1_21[0]"
  city:           "topmostSubform[0].Page1[0].Address_ReadOrder[0].f1_22[0]"
  state:          "topmostSubform[0].Page1[0].Address_ReadOrder[0].f1_23[0]"
  zip:            "topmostSubform[0].Page1[0].Address_ReadOrder[0].f1_24[0]"

# ── Dependents (up to 4) ─────────────────────────────────────────────────────
dependents:
  - first_last:   "topmostSubform[0].Page1[0].Table_Dependents[0].Row1[0].f1_31[0]"
    ssn:          "topmostSubform[0].Page1[0].Table_Dependents[0].Row1[0].f1_32[0]"
    relationship: "topmostSubform[0].Page1[0].Table_Dependents[0].Row1[0].f1_33[0]"
  - first_last:   "topmostSubform[0].Page1[0].Table_Dependents[0].Row2[0].f1_35[0]"
    ssn:          "topmostSubform[0].Page1[0].Table_Dependents[0].Row2[0].f1_36[0]"
    relationship: "topmostSubform[0].Page1[0].Table_Dependents[0].Row2[0].f1_37[0]"
  - first_last:   "topmostSubform[0].Page1[0].Table_Dependents[0].Row3[0].f1_39[0]"
    ssn:          "topmostSubform[0].Page1[0].Table_Dependents[0].Row3[0].f1_40[0]"
    relationship: "topmostSubform[0].Page1[0].Table_Dependents[0].Row3[0].f1_41[0]"
  - first_last:   "topmostSubform[0].Page1[0].Table_Dependents[0].Row4[0].f1_43[0]"
    ssn:          "topmostSubform[0].Page1[0].Table_Dependents[0].Row4[0].f1_44[0]"
    relationship: "topmostSubform[0].Page1[0].Table_Dependents[0].Row4[0].f1_45[0]"

# ── Income (Page 1) ──────────────────────────────────────────────────────────
# Verified with PyMuPDF positional analysis (y-coordinate + neighboring text labels).
# Lines 1a-1h occupy f1_47-f1_56; lines 2a/2b start at f1_58/f1_59.
income:
  line1a_wages:         "topmostSubform[0].Page1[0].f1_47[0]"   # y=450
  line1z_total_wages:   "topmostSubform[0].Page1[0].f1_57[0]"   # y=558 (add 1a-1h)
  line2a_tax_exempt:    "topmostSubform[0].Page1[0].f1_58[0]"   # y=570 left
  line2b_interest:      "topmostSubform[0].Page1[0].f1_59[0]"   # y=570 right
  line3a_qualified_div: "topmostSubform[0].Page1[0].f1_60[0]"   # y=582 left
  line3b_ord_div:       "topmostSubform[0].Page1[0].f1_61[0]"   # y=582 right
  line4a_ira_gross:     "topmostSubform[0].Page1[0].f1_62[0]"   # y=606 left
  line4b_ira:           "topmostSubform[0].Page1[0].f1_63[0]"   # y=606 right
  line5a_pension_gross: "topmostSubform[0].Page1[0].f1_65[0]"   # y=630 left
  line5b_pension:       "topmostSubform[0].Page1[0].f1_66[0]"   # y=630 right
  line6a_ss_total:      "topmostSubform[0].Page1[0].f1_68[0]"   # y=654 left
  line6b_ss_taxable:    "topmostSubform[0].Page1[0].f1_69[0]"   # y=654 right
  line7_cap_gain:       "topmostSubform[0].Page1[0].f1_70[0]"   # y=690
  line8_other:          "topmostSubform[0].Page1[0].f1_72[0]"   # y=714
  line9_total:          "topmostSubform[0].Page1[0].f1_73[0]"   # y=726
  line10_adjustments:   "topmostSubform[0].Page1[0].f1_74[0]"   # y=738
  line11_agi:           "topmostSubform[0].Page1[0].f1_75[0]"   # y=750

# ── Deductions & Taxable Income (Page 2) ─────────────────────────────────────
# In the 2025 Form 1040, deduction lines 12-15 are on page 2.
deductions:
  line12e_total:        "topmostSubform[0].Page2[0].f2_02[0]"   # y=96 (std+QBI combined)
  line15_taxable:       "topmostSubform[0].Page2[0].f2_06[0]"   # y=144

